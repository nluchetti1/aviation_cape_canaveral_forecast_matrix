name: Update aviation dashboard

on:
  schedule:
    - cron: "10 * * * *"     # hourly, 10 past
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dashboard-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # pygrib + cartopy pull in eccodes/geos/proj, which are far more reliable from
      # conda-forge than from pip wheels.
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: dash
          create-args: >-
            python=3.11
            numpy
            matplotlib
            cartopy
            pygrib
            metpy
            requests
          init-shell: bash
          cache-environment: true

      - name: Install pip-only extras
        shell: bash -el {0}
        run: pip install ecmwf-opendata

      - name: Run pipeline
        shell: bash -el {0}
        run: python aviation_dashboard.py

      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A history.json maps/ || true
          git diff --staged --quiet || git commit -m "Auto-update $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
