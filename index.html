                    style="padding:8px 6px; cursor:pointer; text-decoration:underline dotted;">Thompson Index</th>
                <th onclick="showBoxPlot('rh75')" title="Click for the monthly climatology box plot"
                    style="padding:8px 6px; cursor:pointer; text-decoration:underline dotted;">700\u2013500 mb RH</th>
                <th onclick="showBoxPlot('pwat')" title="Click for the monthly climatology box plot"
                    style="padding:8px 6px; cursor:pointer; text-decoration:underline dotted;">PWAT (in)</th>
                <th style="padding:8px 6px;">Cizek Lightning</th>
              </tr></thead><tbody>`;

            if (!joined.length) {
                html += `<tr><td colspan="9" style="padding:14px 6px; color:#94a3b8;">No 10Z rows for either model this run.</td></tr>`;
            } else {
                for (const j of joined) {
                    const a = j[S1.key] || null, b = j[S2.key] || null;
                    const has2 = !!b;
                    const dTi   = (a && b && a.ti != null && b.ti != null) ? a.ti - b.ti : null;
                    const dRh   = (a && b && a.ltg_rh != null && b.ltg_rh != null) ? a.ltg_rh - b.ltg_rh : null;
                    const dPw   = (a && b && a.pwat != null && b.pwat != null) ? a.pwat - b.pwat : null;
                    const dLtg  = (a && b && a.ltg != null && b.ltg != null) ? a.ltg - b.ltg : null;
                    const dMfD  = (a && b) ? ltAngDiff(a.mf_dir, b.mf_dir) : null;
                    const dMfS  = (a && b && a.mf_spd != null && b.mf_spd != null) ? a.mf_spd - b.mf_spd : null;
                    const dAvD  = (a && b) ? ltAngDiff(a.av_dir, b.av_dir) : null;
                    const dAvS  = (a && b && a.av_spd != null && b.av_spd != null) ? a.av_spd - b.av_spd : null;

                    // Regime agreement is judged on the onshore/offshore CLASS first: SE vs E
                    // are different octants but the same story, and that's what matters here.
                    let regimeVerdict;
                    if (!a || !b || !a.regime || !b.regime) regimeVerdict = '<span style="color:#cbd5e1;">\u2014</span>';
                    else if (a.regime === b.regime) regimeVerdict = '<span style="color:#15803d; font-weight:600; font-size:0.78rem;">\u2713 agree</span>';
                    else if ((REGIME_CLASS[a.regime] || 'along') === (REGIME_CLASS[b.regime] || 'along'))
                        regimeVerdict = '<span title="different octant, same onshore/offshore class" style="color:#78350f; background:#fef3c7; padding:1px 7px; border-radius:10px; font-weight:600; font-size:0.76rem;">same class</span>';
                    else regimeVerdict = '<span title="onshore vs offshore disagreement" style="color:#991b1b; background:#fee2e2; padding:1px 7px; border-radius:10px; font-weight:600; font-size:0.76rem;">SPLIT</span>';

                    const tag = (s) => `<td style="padding:6px; color:${s.color}; font-weight:700; font-size:0.76rem; white-space:nowrap;">${s.label}</td>`;
                    const rowTop = 'border-top:1px solid #e2e8f0;';

                    // --- series 1 row (day cell spans all three) ---
                    html += `<tr style="${rowTop}">
                      <td rowspan="3" style="padding:6px; font-weight:600; white-space:nowrap; vertical-align:top; ${rowTop}">
                        ${j.day || ''}<div style="color:#94a3b8; font-weight:400; font-size:0.78rem;">${j.date || ''}</div></td>
                      ${tag(S1)}
                      <td style="padding:6px;">${flowTxt(a)}</td>
                      <td style="padding:6px;">${regimeChip(a && a.regime)}</td>
                      <td style="padding:6px;">${anvilTxt(a)}</td>
                      ${clk('thompson', j, a && a.ti, a && a.ti_pct, b && b.ti, b && b.ti_pct, numTxt(a && a.ti, 1) + pct(a && a.ti_pct))}
                      ${clk('rh75', j, a && a.ltg_rh, a && a.rh_pct, b && b.ltg_rh, b && b.rh_pct, numTxt(a && a.ltg_rh, 0, '%') + pct(a && a.rh_pct))}
                      ${clk('pwat', j, a && a.pwat, a && a.pwat_pct, b && b.pwat, b && b.pwat_pct, numTxt(a && a.pwat, 2) + pct(a && a.pwat_pct))}
                      <td style="padding:6px;">${a && a.ltg != null ? a.ltg + '%' : '\u2014'}</td>
                    </tr>`;

                    // --- series 2 row ---
                    html += `<tr>
                      ${tag(S2)}
                      <td style="padding:6px;">${flowTxt(b)}</td>
                      <td style="padding:6px;">${regimeChip(b && b.regime)}</td>
                      <td style="padding:6px;">${anvilTxt(b)}</td>
                      ${clk('thompson', j, a && a.ti, a && a.ti_pct, b && b.ti, b && b.ti_pct, numTxt(b && b.ti, 1) + pct(b && b.ti_pct))}
                      ${clk('rh75', j, a && a.ltg_rh, a && a.rh_pct, b && b.ltg_rh, b && b.rh_pct, numTxt(b && b.ltg_rh, 0, '%') + pct(b && b.rh_pct))}
                      ${clk('pwat', j, a && a.pwat, a && a.pwat_pct, b && b.pwat, b && b.pwat_pct, numTxt(b && b.pwat, 2) + pct(b && b.pwat_pct))}
                      <td style="padding:6px;">${b && b.ltg != null ? b.ltg + '%' : '\u2014'}</td>
                    </tr>`;

                    // --- delta row ---
                    const dim = has2 ? '' : 'opacity:0.35;';
                    html += `<tr style="background:#fafbfc; ${dim}">
                      <td style="padding:6px; color:#94a3b8; font-weight:700; font-size:0.76rem;">\u0394</td>
                      <td style="padding:6px;">${has2 ? ltDeltaChip(dMfD, 'dir') + ' ' + ltDeltaChip(dMfS, 'spd') : '<span style="color:#cbd5e1;">\u2014</span>'}</td>
                      <td style="padding:6px;">${regimeVerdict}</td>
                      <td style="padding:6px;">${has2 ? ltDeltaChip(dAvD, 'dir') + ' ' + ltDeltaChip(dAvS, 'spd') : '<span style="color:#cbd5e1;">\u2014</span>'}</td>
                      <td style="padding:6px;">${ltDeltaChip(dTi, 'ti')}</td>
                      <td style="padding:6px;">${ltDeltaChip(dRh, 'rh')}</td>
                      <td style="padding:6px;">${ltDeltaChip(dPw, 'pwat')}</td>
                      <td style="padding:6px;">${ltDeltaChip(dLtg, 'ltg')}</td>
                    </tr>`;
                }
            }
            html += `</tbody></table>
              <div style="font-size:0.74rem; color:#94a3b8; margin-top:10px;">
                \u0394 is ${S1.label} minus ${S2.label}. Direction deltas use the smallest signed angle,
                so 350\u00b0 against 010\u00b0 reads as 20\u00b0. Regime agreement is judged on the
                onshore/offshore class first \u2014 SE against E is a different octant but the same
                story, while an onshore/offshore disagreement is flagged SPLIT.
              </div>`;
            document.getElementById('ltBody').innerHTML = html;
        }

        function renderLaunchThermo() {
            // The synthetic 'GFS vs ECMWF' dropdown entry renders a different table entirely.
            if (ltIsCompare()) { renderLaunchThermoCompare(); return; }
            const thermo = ltActiveThermo();
            const model = document.getElementById('ltModel').value;
            const rows = (thermo.by_model && thermo.by_model[model]) || [];
            const ens = (rows[0] && /(\d+)-mem/.exec(rows[0].engine || '')) ;
            const ensNote = ens ? `<div style="font-size:0.78rem; color:#475569; margin:2px 0 8px;">${
                (document.getElementById('ltModel').value || '').toUpperCase()} = ${ens[1]}-member ensemble (mean of per-member indices, not the mean sounding).</div>` : '';
            const pctColor = (v) => {
                // low percentiles = calm/dry/stable, high = moist/unstable -> escalate cool->red
                if (v == null) return null;
                if (v >= 90) return { bg: '#dc2626', fg: '#ffffff' };  // >=90th
                if (v >= 75) return { bg: '#f59e0b', fg: '#3a2a00' };  // 75-89th
                if (v >= 50) return { bg: '#fde68a', fg: '#3a2a00' };  // 50-74th
                if (v >= 25) return { bg: '#dbeafe', fg: '#1e3a5f' };  // 25-49th
                return { bg: '#e0f2fe', fg: '#0c4a6e' };               // <25th
            };
            const pct = (v) => {
                if (v == null) return '<span style="color:#94a3b8;">—</span>';
                const c = pctColor(v);
                return `<span style="background:${c.bg}; color:${c.fg}; padding:1px 7px; border-radius:10px; font-weight:600; font-size:0.82rem;">${v}<sup>th</sup></span>`;
            };
            const num = (v) => v == null ? '—' : v;
            const flow = (r) => (r.mf_dir == null) ? '—' : `${r.mf_dir}° / ${num(r.mf_spd)} kt`;
            const anvil = (r) => (r.av_dir == null) ? '—' : `${r.av_dir}° / ${num(r.av_spd)} kt`;
            // The Cape's coast faces roughly east, so an easterly component is ONSHORE (marine,
            // moist, sea-breeze suppressed) and a westerly component is OFFSHORE (continental,
            // sea-breeze favorable). Due N/S is alongshore — neither.
            const REGIME_CLASS = { NE:'on', E:'on', SE:'on', NW:'off', W:'off', SW:'off', N:'along', S:'along' };
            const regimeCell = (v) => {
                if (!v) return '—';
                const k = REGIME_CLASS[v] || 'along';
                const style = k === 'on'  ? 'background:#dbeafe; color:#0c4a6e;'      // onshore  — blue
                            : k === 'off' ? 'background:#fed7aa; color:#7c2d12;'      // offshore — amber
                            :               'background:#dcfce7; color:#14532d;';     // alongshore — green
                const tag = k === 'on' ? 'onshore' : k === 'off' ? 'offshore' : 'alongshore';
                return `<span title="${tag}" style="${style} padding:2px 9px; border-radius:10px; font-weight:600;">${v}</span>
                        <span style="color:#94a3b8; font-size:0.72rem; margin-left:4px;">${tag}</span>`;
            };
            const clickCell = (varName, r, val, pctVal, inner) => {
                if (val == null || r.month == null) return `<td style="padding:8px 6px;">${inner}</td>`;
                return `<td onclick="showBoxPlotDay('${varName}', ${r.month}, ${val}, '${r.date}', ${pctVal == null ? 'null' : pctVal})"
                          title="Click to see ${r.date} on the monthly climatology"
                          style="padding:8px 6px; cursor:pointer;">${inner}</td>`;
            };
            const rhCell = (r) => {
                if (r.ltg_rh == null) return '—';
                return `${r.ltg_rh}% <span style="color:#cbd5e1;">|</span> ${pct(r.rh_pct)}`;
            };
            const ltgCell = (r) => {
                const v = r.ltg;
                if (v == null) return '<span style="color:#94a3b8;">—</span>';
                const c = pctColor(Math.round(v));   // same cool->red ramp as the percentiles
                let s = `<span style="background:${c.bg}; color:${c.fg}; padding:1px 8px; border-radius:10px; font-weight:600;">${v}%</span>`;
                // Ensemble columns also carry the member spread, so a confident 85% reads
                // differently from an 85% mean spanning 20-99%.
                if (r.ltg_min != null && r.ltg_max != null) {
                    s += `<div style="font-size:0.68rem; color:#64748b; margin-top:2px;">min ${r.ltg_min}% &middot; max ${r.ltg_max}%${
                        r.ltg_n ? ` <span style="color:#94a3b8;">(${r.ltg_n} mem)</span>` : ''}</div>`;
                }
                return s;
            };
            let html = ensNote + `<table style="width:100%; border-collapse:collapse; font-size:0.9rem;">
              <thead><tr style="text-align:left; color:#475569; border-bottom:2px solid #e2e8f0;">
                <th style="padding:8px 6px; width:150px; white-space:nowrap;">Day</th>
                <th style="padding:8px 6px;">1000–700 mb Mean Flow</th>
                <th style="padding:8px 6px;">Flow Regime</th>
                <th style="padding:8px 6px;">Anvil Flow (300–150 mb)</th>
                <th onclick="showBoxPlot('thompson')" title="Click for the monthly climatology box plot"
                    style="padding:8px 6px; cursor:pointer; text-decoration:underline dotted;">Thompson Index</th>
                <th onclick="showBoxPlot('rh75')" title="Click for the monthly climatology box plot"
                    style="padding:8px 6px; cursor:pointer; text-decoration:underline dotted;">700–500 mb RH</th>
                <th onclick="showBoxPlot('pwat')" title="Click for the monthly climatology box plot"
                    style="padding:8px 6px; cursor:pointer; text-decoration:underline dotted;">PWAT (in)</th>
                <th style="padding:8px 6px;">Cizek Lightning Probability</th>
              </tr></thead><tbody>`;
            if (!rows.length) {
                html += `<tr><td colspan="8" style="padding:14px 6px; color:#94a3b8;">No 10Z rows for ${model.toUpperCase()} this run.</td></tr>`;
            } else {
                for (const r of rows) {
                    html += `<tr style="border-bottom:1px solid #f1f5f9;">
                      <td style="padding:8px 6px; font-weight:600; white-space:nowrap;">${r.day}<span style="color:#94a3b8; font-weight:400;"> · ${r.date}</span></td>
                      <td style="padding:8px 6px;">${flow(r)}</td>
                      <td style="padding:8px 6px;">${regimeCell(r.regime)}</td>
                      <td style="padding:8px 6px;">${anvil(r)}</td>
                      ${clickCell('thompson', r, r.ti, r.ti_pct, `${num(r.ti)} <span style="color:#cbd5e1;">|</span> ${pct(r.ti_pct)}`)}
                      ${clickCell('rh75', r, r.ltg_rh, r.rh_pct, rhCell(r))}
                      ${clickCell('pwat', r, r.pwat, r.pwat_pct, `${num(r.pwat)} <span style="color:#cbd5e1;">|</span> ${pct(r.pwat_pct)}`)}
                      <td style="padding:8px 6px;">${ltgCell(r)}</td>
                    </tr>`;
                }
            }
            html += `</tbody></table>`;
            document.getElementById('ltBody').innerHTML = html;
        }

        window.onload = initDashboard;
    </script>
    <div id="ltModal" onclick="if(event.target===this)hideLaunchThermo()"
         style="display:none; position:fixed; inset:0; background:rgba(15,23,42,0.55); z-index:1000; align-items:flex-start; justify-content:center;">
      <div style="background:#fff; margin-top:5vh; max-width:1180px; width:96%; max-height:88vh; overflow:auto; border-radius:10px; box-shadow:0 10px 40px rgba(0,0,0,0.3);">
        <div style="display:flex; align-items:center; justify-content:space-between; padding:14px 18px; border-bottom:1px solid #e2e8f0; position:sticky; top:0; background:#fff;">
          <div style="font-weight:700; color:#1e3a5f;">10Z Synoptic — <span id="ltSite">KXMR</span></div>
          <div style="display:flex; align-items:center; gap:8px;">
            <label style="font-size:0.85rem; color:#475569;">Model:</label>
            <select id="ltModel" onchange="ltRenderCmpPickers(); renderLaunchThermoRuns(); renderLaunchThermo();" style="padding:4px 8px; border:1px solid #cbd5e1; border-radius:6px;"></select>
            <span id="ltCmpPick" style="display:none; align-items:center; gap:5px;"></span>
            <button onclick="hideLaunchThermo()" style="border:none; background:#e2e8f0; border-radius:6px; padding:4px 10px; cursor:pointer;">✕</button>
          </div>
        </div>
        <div id="ltRuns" style="padding:10px 18px 0; display:flex; align-items:center; flex-wrap:wrap;"></div>
        <div id="ltBody" style="padding:6px 18px 18px;"></div>
      </div>
    </div>
    <div id="bpModal" onclick="if(event.target===this)hideBoxPlot()"
         style="display:none; position:fixed; inset:0; background:rgba(15,23,42,0.6); z-index:1100; align-items:flex-start; justify-content:center;">
      <div style="background:#fff; margin-top:6vh; max-width:980px; width:96%; max-height:86vh; overflow:auto; border-radius:10px; box-shadow:0 10px 40px rgba(0,0,0,0.35);">
        <div style="display:flex; align-items:center; justify-content:space-between; padding:12px 18px; border-bottom:1px solid #e2e8f0;">
          <div style="font-weight:700; color:#1e3a5f;">Climatology &mdash; XMR</div>
          <button onclick="hideBoxPlot()" style="border:none; background:#e2e8f0; border-radius:6px; padding:4px 10px; cursor:pointer;">✕</button>
        </div>
        <div id="bpBody" style="padding:14px 18px 18px;"></div>
      </div>
    </div>
</body>
</html>
